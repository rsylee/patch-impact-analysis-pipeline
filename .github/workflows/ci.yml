name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check extract/ load/ analysis/ dashboard/

      - name: Run unit tests
        run: pytest tests/ -v

  dbt-checks:
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      # profiles.yml reads these two via env_var(), so CI has to set them too
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SERVICE_ACCOUNT_JSON: /tmp/gcp-key.json
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
    defaults:
      run:
        working-directory: transform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        # pin dbt-core too -- pinning only the adapter let pip pull dbt-core 1.12
        run: pip install "dbt-core==1.8.*" "dbt-bigquery==1.8.2"

      - name: Write GCP key
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json

      - name: Create profiles.yml from template
        # the real profiles.yml isn't committed; the template only holds
        # env_var() references, so it's safe to copy as-is
        run: cp profiles.yml.example profiles.yml

      - name: dbt deps
        run: dbt deps

      - name: dbt debug
        run: dbt debug --profiles-dir .

      - name: dbt compile
        run: dbt compile --profiles-dir .
