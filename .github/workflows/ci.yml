name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (ruff)
        run: ruff check extract/ load/ analysis/ dashboard/

      - name: Run unit tests
        run: pytest tests/ -v

  dbt-checks:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-bigquery==1.8.2

      - name: Authenticate to GCP
        run: echo '${{ secrets.GCP_SA_KEY }}' > /tmp/gcp-key.json

      - name: dbt debug
        working-directory: transform
        run: dbt debug --profiles-dir .
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json

      - name: dbt compile
        working-directory: transform
        run: dbt compile --profiles-dir .
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
